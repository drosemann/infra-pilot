[project]
name = "infra-passenger"
version = "2.0.0"
description = "infra-passenger CLI - touch every pod personally"
keywords = ["infrastructure", "kubernetes", "gitops", "middle-man", "manual-control"]
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "typer==0.26.8",
    "rich==15.0.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
]

[project.scripts]
infra-passenger = "infra_passenger.main:app"
ipas = "infra_passenger.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["infra_passenger*"]

{{- if and .Values.ingress.panel.enabled .Values.managementPanel.enabled -}}
{{- $fullName := include "infra-pilot.fullname" . -}}
{{- $svcPort := .Values.managementPanel.service.port -}}
{{- $className := .Values.ingress.className -}}
{{- if and $className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.panel.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.panel.annotations "kubernetes.io/ingress.class" $className }}
  {{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-panel
  labels:
    {{- include "infra-pilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: management-panel
  {{- with .Values.ingress.panel.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and $className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ $className }}
  {{- end }}
  {{- if .Values.ingress.panel.tls }}
  tls:
    {{- range .Values.ingress.panel.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.panel.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and .pathType (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              service:
                name: {{ $fullName }}-panel
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}

{{- if .Values.managementPanel.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infra-pilot.fullname" . }}-panel
  labels:
    {{- include "infra-pilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: management-panel
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "infra-pilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: management-panel
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "infra-pilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: management-panel
    spec:
      serviceAccountName: {{ include "infra-pilot.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: management-panel
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.managementPanel.image.repository }}:{{ .Values.managementPanel.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            {{- toYaml .Values.managementPanel.env | nindent 12 }}
            {{- if .Values.managementPanel.existingSecret }}
            - name: ORCHESTRATOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.managementPanel.existingSecret }}
                  key: orchestrator-api-token
                  optional: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml (.Values.managementPanel.resources | default .Values.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infra-pilot.fullname" . }}-panel
  labels:
    {{- include "infra-pilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: management-panel
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.managementPanel.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "infra-pilot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: management-panel
{{- end }}

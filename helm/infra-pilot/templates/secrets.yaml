{{- /* Stable Secret name infra-pilot-secrets shared with postgresql/redis consumers; see _helpers.tpl secretName */}}
{{- if .Values.secrets.create }}
{{- $globalAdminPasswordKey := dig "postgresql" "auth" "secretKeys" "adminPasswordKey" "" .Values.global }}
{{- $adminPasswordKey := required "postgresql.auth.secretKeys.adminPasswordKey is required when secrets.create is true" (coalesce $globalAdminPasswordKey .Values.postgresql.auth.secretKeys.adminPasswordKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infra-pilot.secretName" . }}
  labels:
    {{- include "infra-pilot.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* In production, fail fast if required keys are empty; allow empty defaults for helm template/lint and non-prod */}}
  {{- /* Bitnami PostgreSQL resolves the admin password key from global PostgreSQL values before local values.
       The rendered key follows that precedence so custom mappings remain valid for the chart-generated Secret. */}}
  {{- if eq .Values.global.environment "production" }}
  db-password: {{ required "secrets.data.DB_PASSWORD is required in production – provide via external secret or set secrets.data.DB_PASSWORD (prefer existingSecret)" .Values.secrets.data.DB_PASSWORD | b64enc | quote }}
  {{ $adminPasswordKey }}: {{ required "secrets.data.POSTGRES_PASSWORD is required in production – provide the PostgreSQL administrator credential via an external secret or set secrets.data.POSTGRES_PASSWORD" .Values.secrets.data.POSTGRES_PASSWORD | b64enc | quote }}
  redis-password: {{ required "secrets.data.REDIS_PASSWORD is required in production – provide via external secret or set secrets.data.REDIS_PASSWORD" .Values.secrets.data.REDIS_PASSWORD | b64enc | quote }}
  api-key: {{ required "secrets.data.API_KEY is required in production – generate via: openssl rand -hex 32" .Values.secrets.data.API_KEY | b64enc | quote }}
  {{- else }}
  db-password: {{ .Values.secrets.data.DB_PASSWORD | b64enc | quote }}
  {{ $adminPasswordKey }}: {{ .Values.secrets.data.POSTGRES_PASSWORD | b64enc | quote }}
  redis-password: {{ .Values.secrets.data.REDIS_PASSWORD | b64enc | quote }}
  api-key: {{ .Values.secrets.data.API_KEY | b64enc | quote }}
  {{- end }}
{{- end }}

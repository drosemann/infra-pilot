{{- $jobsEnabled := or .Values.migration.enabled .Values.migration.standalone.enabled .Values.backup.enabled .Values.restore.enabled }}
{{- if and .Values.jobs.serviceAccount.create $jobsEnabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "infra-pilot.jobsServiceAccount" . }}
  labels:
    {{- include "infra-pilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: jobs
  {{- with .Values.jobs.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The operational Jobs need no Kubernetes API access: no Role/RoleBinding is
# created and the projected token is disabled (least privilege).
automountServiceAccountToken: false
{{- end }}

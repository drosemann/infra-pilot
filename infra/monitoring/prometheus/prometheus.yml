global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

alerting:
  # No Alertmanager is deployed by default; add its address here when you
  # run one (e.g. via the Helm prometheus.alertmanager sub-chart), otherwise
  # alerts evaluate but have no receiver.
  alertmanagers:
    - static_configs:
        - targets: []
      timeout: 3s

scrape_configs:
  - job_name: prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: monitoring
          component: prometheus

  - job_name: infra-pilot-services
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      # NOTE: only the orchestrator exposes Prometheus /metrics here.
      # The management panel exposes JSON health at /health + /api/health
      # (no Prometheus format) — do not add management-panel:3001 until it
      # serves /metrics, or failed scrapes will spam the log.
      - targets:
          - "orchestrator-agent:8500"
        labels:
          project: infra-pilot
          environment: production

  - job_name: node-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          service: host
          component: node-exporter

  - job_name: postgres-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: database
          component: postgres

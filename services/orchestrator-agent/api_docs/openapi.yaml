openapi: 3.0.3
info:
  title: Infra Pilot Orchestrator Agent API
  version: 1.0.0
  description: |
    HTTP surface of the Orchestrator Agent (aiohttp webhook server).
    This file is the single source of truth for the route table: the
    contract test tests/unit/test_openapi_contract.py fails when the
    running routes and this spec drift apart.
    Routes under /api/ require the FEDERATION_API_TOKEN bearer token
    (fail closed in production). /webhook/gitops requires its own
    HMAC-SHA256 signature; /health and /metrics are public.
servers:
  - url: http://localhost:8500
    description: Local development (GITOPS_WEBHOOK_PORT)
security:
  - BearerAuth: []
tags:
  - name: Monitoring
    description: Health and Prometheus metrics endpoints
  - name: Federation
    description: Federation peer status
  - name: RBAC
    description: Organizations, roles and permissions management
  - name: Deployments
    description: Manifest-based reconciliation and provider discovery
  - name: Secrets
    description: Secret get/set/rotate against the configured secrets backend
  - name: GitOps
    description: Signed webhook that converges toward a manifest
paths:
  /health:
    get:
      tags: [Monitoring]
      summary: Health check (database probe)
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service, postgresql]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  service: { type: string }
                  postgresql: { type: string, enum: [up, down] }
  /ready:
    get:
      tags: [Monitoring]
      summary: Readiness check (database probe, distinct from liveness)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, enum: [ready] }
                  service: { type: string }
        "503":
          description: Not ready (DB down)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/ready:
    get:
      tags: [Monitoring]
      summary: Readiness check (aliased under authenticated prefix)
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, enum: [ready] }
                  service: { type: string }
        "503":
          description: Not ready (DB down)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/health:
    get:
      tags: [Monitoring]
      summary: Health check (aliased under the authenticated API prefix)
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service, postgresql]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  service: { type: string }
                  postgresql: { type: string, enum: [up, down] }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthNotConfigured"
  /metrics:
    get:
      tags: [Monitoring]
      summary: Prometheus metrics
      description: Metrics in Prometheus text exposition format (OpenMetrics compatible).
      security: []
      responses:
        "200":
          description: Metrics payload
          content:
            text/plain:
              schema: { type: string }
  /api/v1/federation/status:
    get:
      tags: [Federation]
      summary: Federation status
      responses:
        "200":
          description: Federation status
          content:
            application/json:
              schema:
                type: object
                required: [status, service, federation, secrets_backend, version]
                properties:
                  status: { type: string }
                  service: { type: string }
                  federation:
                    type: object
                    properties:
                      enabled: { type: boolean }
                  secrets_backend:
                    type: string
                    description: Active secrets backend (none, vault, aws, azure).
                  version: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthNotConfigured"
  /api/v1/rbac/roles:
    get:
      tags: [RBAC]
      summary: List all roles with their permissions
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
    post:
      tags: [RBAC]
      summary: Create a custom role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name: { type: string, minLength: 1 }
                permissions:
                  type: array
                  items: { $ref: "#/components/schemas/Permission" }
                description: { type: string }
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400":
          description: Missing fields or unknown permission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/rbac/roles/{role_name}:
    delete:
      tags: [RBAC]
      summary: Delete a custom role (built-ins cannot be deleted)
      parameters:
        - name: role_name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Role deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
        "400":
          description: Cannot delete built-in role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Role not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/rbac/orgs:
    post:
      tags: [RBAC]
      summary: Create an organization and auto-assign the owner role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, owner_user_id]
              properties:
                name: { type: string, minLength: 1 }
                owner_user_id: { type: string, minLength: 1 }
                id: { type: string }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400":
          description: Missing fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [RBAC]
      summary: List organizations for a user
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Organization list
          content:
            application/json:
              schema:
                type: object
                required: [orgs]
                properties:
                  orgs:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
        "400":
          description: user_id query parameter missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/rbac/orgs/{org_id}:
    delete:
      tags: [RBAC]
      summary: Delete an organization and its memberships
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Organization deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
        "404":
          description: Organization not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/rbac/assign:
    post:
      tags: [RBAC]
      summary: Assign a role to a user within an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, org_id, role_name]
              properties:
                user_id: { type: string }
                org_id: { type: string }
                role_name: { type: string }
                project_id: { type: string }
                granted_by: { type: string }
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400":
          description: Missing fields or unknown role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Organization not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [RBAC]
      summary: Revoke a membership (role assignment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, org_id]
              properties:
                user_id: { type: string }
                org_id: { type: string }
                project_id: { type: string }
      responses:
        "200":
          description: Membership revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: object
                    properties:
                      user_id: { type: string }
                      org_id: { type: string }
                      project_id: { type: string }
        "400":
          description: Missing fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Membership not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/rbac/orgs/{org_id}/permissions:
    get:
      tags: [RBAC]
      summary: Resolved permissions for a user within an organization
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolved permissions
          content:
            application/json:
              schema:
                type: object
                required: [user_id, org_id, permissions]
                properties:
                  user_id: { type: string }
                  org_id: { type: string }
                  permissions:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
        "400":
          description: user_id query parameter missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Organization not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/rbac/orgs/{org_id}/members:
    get:
      tags: [RBAC]
      summary: List memberships of an organization
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string }
        - name: project_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Membership list
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
        "404":
          description: Organization not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/deployments:
    post:
      tags: [Deployments]
      summary: Reconcile a manifest on demand
      description: |
        Body carries an InfraFile manifest. When user_id and org_id are
        supplied the caller must hold the manifest:deploy permission in
        that organization; without them the federation token holder acts
        as platform administrator. Returns 207 when reconciliation
        produced errors, 200 when it was clean.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { type: object }
                dry_run: { type: boolean, default: false }
                user_id: { type: string }
                org_id: { type: string }
      responses:
        "200":
          description: Reconcile completed without errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileResult" }
        "207":
          description: Reconcile completed with errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileResult" }
        "400":
          description: Invalid body or manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: manifest:deploy permission required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/providers:
    get:
      tags: [Deployments]
      summary: List registered compute providers
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items: { type: string }
  /api/v1/secrets/get:
    post:
      tags: [Secrets]
      summary: Resolve a stored secret (secret:read required)
      description: |
        Reads the secret at the given path (optionally a single key) as the
        actor identified by ?actor_user_id or X-Actor-User-Id. Responses
        for 200 carry the secret content; reads are cached in-process for
        SECRETS_CACHE_TTL seconds and cached entries are invalidated by
        set/rotate. Secret values are never logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, path]
              properties:
                org_id: { type: string }
                path: { type: string, pattern: "^[A-Za-z0-9_/.-]{1,120}$" }
                key: { type: string, pattern: "^[A-Za-z0-9_/.-]{1,120}$" }
      responses:
        "200":
          description: Secret resolved
          content:
            application/json:
              schema:
                type: object
                required: [path, value]
                properties:
                  path: { type: string }
                  key: { type: string, nullable: true }
                  value:
                    description: Stored secret content (object, string or scalar)
        "400":
          description: Invalid body, path or key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: secret:read permission required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown org, or no secret stored at path/key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Secrets backend error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No secrets backend configured (set SECRETS_BACKEND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/secrets/set:
    post:
      tags: [Secrets]
      summary: Create or update a secret (secret:write required)
      description: |
        Objects are stored as the full secret at path; bare strings are
        stored under the reserved key "value" so
        rotate (which rewrites only "value") applies cleanly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, path, data]
              properties:
                org_id: { type: string }
                path: { type: string, pattern: "^[A-Za-z0-9_/.-]{1,120}$" }
                data:
                  anyOf:
                    - type: object
                      description: Key/value map stored under path
                    - type: string
                      description: 'Stored as {"value": <string>}'
      responses:
        "201":
          description: Secret stored
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: string }
        "400":
          description: Invalid body, path or data shape
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: secret:write permission required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown org
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Secrets backend error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No secrets backend configured (set SECRETS_BACKEND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/secrets/rotate:
    post:
      tags: [Secrets]
      summary: Rotate a secret with a fresh random value (secret:rotate required)
      description: |
        Generates a new random value (64 hex chars), writes it under the
        reserved key "value" at path and invalidates cached reads. The
        response is metadata only: the rotated value is never returned in
        the HTTP response and never logged by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, path]
              properties:
                org_id: { type: string }
                path: { type: string, pattern: "^[A-Za-z0-9_/.-]{1,120}$" }
      responses:
        "200":
          description: Rotation applied (metadata only, no value returned)
          content:
            application/json:
              schema:
                type: object
                required: [rotated, at]
                properties:
                  rotated: { type: string }
                  at: { type: string, format: date-time }
        "400":
          description: Invalid body or path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: secret:rotate permission required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown org
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Secrets backend error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No secrets backend configured (set SECRETS_BACKEND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /webhook/gitops:
    post:
      tags: [GitOps]
      summary: GitOps push webhook (HMAC-SHA256 signed)
      description: |
        Converges toward the manifest in the body. Requires the
        X-Timestamp and X-Signature-256 headers; fails closed when
        GITOPS_WEBHOOK_TOKEN is not configured.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { type: object }
                dry_run: { type: boolean, default: false }
                user_id: { type: string }
                org_id: { type: string }
      responses:
        "200":
          description: Reconcile completed without errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileResult" }
        "207":
          description: Reconcile completed with errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileResult" }
        "400":
          description: Invalid body or manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing, stale or invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: GITOPS_WEBHOOK_TOKEN not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: FEDERATION_API_TOKEN (constant-time compared)
  responses:
    Unauthorized:
      description: Invalid or missing federation API token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AuthNotConfigured:
      description: FEDERATION_API_TOKEN is required in production
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
    Permission:
      type: string
      enum:
        - instance:create
        - instance:read
        - instance:update
        - instance:delete
        - instance:start
        - instance:stop
        - instance:restart
        - snapshot:create
        - snapshot:restore
        - backup:create
        - backup:restore
        - network:create
        - network:read
        - network:update
        - network:delete
        - dns:create
        - dns:update
        - dns:delete
        - billing:read
        - billing:manage
        - org:manage
        - org:delete
        - project:manage
        - project:delete
        - role:assign
        - member:invite
        - member:remove
        - audit:read
        - audit:export
        - manifest:deploy
        - manifest:read
        - secret:read
        - secret:write
        - secret:rotate
    Role:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
    Organization:
      type: object
      required: [id, name, owner_user_id]
      properties:
        id: { type: string }
        name: { type: string }
        owner_user_id: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Membership:
      type: object
      required: [user_id, org_id, role_name]
      properties:
        user_id: { type: string }
        org_id: { type: string }
        project_id: { type: string }
        role_name: { type: string }
        granted_by: { type: string }
        granted_at: { type: string, format: date-time }
    ReconcileResult:
      type: object
      properties:
        errors:
          type: array
          items: { type: string }
